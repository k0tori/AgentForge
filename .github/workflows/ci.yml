name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU torch and project
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          pip install email-validator
      - name: Lint
        run: ruff check src toy-repo/src tests
      - name: Test AgentForge
        run: pytest -m "not integration"
      - name: M1 task lifecycle
        run: pytest tests/integration/test_task_lifecycle.py tests/integration/test_task_processes.py tests/integration/test_pge_failures.py tests/unit/test_failure_reporting.py
      - name: Test toy-repo
        working-directory: toy-repo
        run: pytest

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pydantic-settings pytest
      - name: Real Docker sandbox
        run: |
          docker compose version
          SANDBOX_MODE=docker pytest tests/sandbox -m sandbox
