# WARNING: Credentials below are for local development ONLY.
# Override POSTGRES_PASSWORD and other secrets via environment variables in production.

services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Built by a normal `docker compose build` / `up --build`. It is not a long-running
  # service and it does not receive the Docker socket. `true` only publishes the image.
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: agentforge-sandbox:latest
    pull_policy: never
    entrypoint: ["true"]
    restart: "no"

  # The only service that receives the Docker socket. It accepts pytest/ruff on a Unix socket.
  executor:
    build:
      context: .
      dockerfile: Dockerfile.executor
    image: agentforge-executor:latest
    user: "0:0"
    environment:
      # Stable for this compose project across restarts. Another project on the
      # same daemon must use a different project name, or the two share a cleanup domain.
      SANDBOX_EXECUTOR_ID: ${COMPOSE_PROJECT_NAME:-agentforge}
      SANDBOX_EXECUTOR_SOCK: /run/agentforge/executor.sock
      SANDBOX_WORKSPACE_ROOT: /var/lib/agentforge/workspaces
      SANDBOX_API_UID: "10002"
      SANDBOX_API_GID: "10002"
      SANDBOX_RUN_UID: "10002"
      SANDBOX_RUN_GID: "10002"
      SANDBOX_IMAGE: agentforge-sandbox:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same absolute path in the container and on the host. dockerd opens the host path.
      - /var/lib/agentforge/workspaces:/var/lib/agentforge/workspaces
      - executor-sock:/run/agentforge
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect(os.environ['SANDBOX_EXECUTOR_SOCK']); s.close()",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    depends_on:
      sandbox:
        condition: service_completed_successfully
    restart: unless-stopped

  api-init:
    build: .
    image: agentforge-api:latest
    user: "0:0"
    entrypoint: ["chown", "10002:10002", "/var/lib/agentforge"]
    volumes:
      - agentforge-tasks:/var/lib/agentforge
    restart: "no"

  api:
    build: .
    image: agentforge-api:latest
    user: "10002:10002"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/agentforge
      REDIS_URL: redis://redis:6379/0
      TOY_REPO_PATH: /app/toy-repo
      SANDBOX_MODE: docker
      SANDBOX_IMAGE: agentforge-sandbox:latest
      SANDBOX_EXECUTOR_SOCK: /run/agentforge/executor.sock
      SANDBOX_WORKSPACE_ROOT: /var/lib/agentforge/workspaces
      TASK_DB_PATH: /var/lib/agentforge/tasks.sqlite
      # Empty unless the operator sets it. The demo stays off by default.
      DETERMINISTIC_EXECUTOR: ${DETERMINISTIC_EXECUTOR:-false}
      API_KEY: ${API_KEY:-}
    volumes:
      # Task rows survive image rebuilds. The path matches TASK_DB_PATH.
      - agentforge-tasks:/var/lib/agentforge
      # Same host path the executor gives to dockerd. This is not the Docker socket.
      - /var/lib/agentforge/workspaces:/var/lib/agentforge/workspaces
      - executor-sock:/run/agentforge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      executor:
        condition: service_healthy
      api-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  agentforge-tasks:
  executor-sock:
